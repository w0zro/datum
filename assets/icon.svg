  <polygon points="128,128 172,172 128,216" fill="#69b9f7"/>
  <polygon points="128,128 128,216 84,172"  fill="#fa94cd"/>
  <polygon points="128,128 84,172 40,128"   fill="#f5b9d9"/>
  <polygon points="128,128 40,128 84,84"    fill="#fe9864"/>
  <polygon points="128,128 84,84 128,40"    fill="#f8bd5f"/>
